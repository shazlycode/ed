<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <script>
    // Works under any repository name: base = folder of this page.
    document.write('<base href="' + location.pathname.replace(/[^/]*$/, '') + '">');
  </script>
  <script>
    // All files sit next to index.html. Flutter asks for "assets/x/y.z";
    // serve it from the flat file "assets__x__y.z" instead.
    (function () {
      var basePath = location.pathname.replace(/[^/]*$/, '');
      var origFetch = window.fetch.bind(window);
      window.fetch = function (input, init) {
        try {
          var url = new URL(typeof input === 'string' ? input : (input && input.url) || String(input), document.baseURI);
          if (url.origin === location.origin && url.pathname.indexOf(basePath + 'assets/') === 0) {
            url.pathname = basePath + url.pathname.slice(basePath.length).split('/').join('__');
            input = (typeof input === 'string' || input instanceof URL) ? url.href : new Request(url.href, input);
          }
        } catch (e) {}
        return origFetch(input, init);
      };
    })();
  </script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Egyptian pharmacist drug reference: search 11,773 medicines and supplements, leaflets, alternatives and AI monographs.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Drug Index">
  <link rel="apple-touch-icon" href="Icon-maskable-192.png">
  <meta name="theme-color" content="#A50D2B">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Egypt Drug Index</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>

</body>
</html>
